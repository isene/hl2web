<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- a HyperList becoming a page: the browser frame holds the list -->
  <rect x="46" y="46" width="164" height="120" rx="8"
        fill="#0a0a14" stroke="#7aa2c0" stroke-width="3"/>
  <line x1="46" y1="68" x2="210" y2="68" stroke="#7aa2c0" stroke-width="3"/>
  <g fill="#3d5a76">
    <circle cx="58" cy="57" r="4"/>
    <circle cx="72" cy="57" r="4"/>
    <circle cx="86" cy="57" r="4"/>
  </g>
  <g stroke-linecap="round" stroke-width="7">
    <line x1="62"  y1="86"  x2="150" y2="86"  stroke="#4a8dff"/>
    <line x1="80"  y1="106" x2="186" y2="106" stroke="#d8d8d8"/>
    <line x1="98"  y1="126" x2="164" y2="126" stroke="#33cc55"/>
    <line x1="80"  y1="146" x2="176" y2="146" stroke="#ff4444"/>
  </g>
  <g fill="#d75fff">
    <path d="M50 80 l10 6 -10 6 z"/>
    <path d="M68 100 l10 6 -10 6 z"/>
    <path d="M68 140 l10 6 -10 6 z"/>
  </g>
  <circle cx="90" cy="126" r="5" fill="#d75fff"/>

  <text x="128" y="212" font-family="monospace" font-size="24" font-weight="bold"
        fill="url(#rust)" text-anchor="middle" letter-spacing="2">hl2web</text>
  <text x="128" y="230" font-family="monospace" font-size="8" fill="#888"
